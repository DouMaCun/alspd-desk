# ALSPD-DESK 配置示例
#
# 用法：复制本文件为 config.toml 并填写实际值。
# config.toml 已被 .gitignore 排除，不会入库。
#
# Agent（公司电脑）、Viewer（家里电脑）、Relay（VPS）三方共用这一份格式。
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ 两个密钥是分开的，别混淆：                                        │
# │   relay_token —— 中继也知道它，只用于「证明身份、允许配对」         │
# │   password    —— 只给 Agent/Viewer，用于端到端加密，从不发给中继    │
# │ 因此即使 VPS 被入侵，攻击者拿到 relay_token 也只能抢占配对，        │
# │ 读不到任何画面或键鼠内容。                                        │
# └─────────────────────────────────────────────────────────────────┘

[common]
# VPS 中继地址：只填 IP 或域名，不要带 http:// 前缀
relay_host = "1.2.3.4"

# 端口回退链：按顺序尝试，第一个连上的生效。
# 443 最优（最易穿防火墙且最不显眼），其余为备胎。
relay_ports = [443, 8443, 80, 8080]

# 房间号：两端必须完全一致。建议用不易猜到的随机串。
room = "change-me-room"

# 中继配对令牌：三端（Agent / Viewer / Relay）必须一致。
# 建议 32 位以上随机串。它不会泄露画面内容。
relay_token = "change-me-relay-token-32-chars-min"

# 端到端加密密码：只有 Agent 与 Viewer 需要，**绝对不要填到中继的配置里**。
# 建议 16 位以上随机串。持有它即可解密画面 —— 切勿泄露。
password = "change-me-strong-password"

# ---- 代理（公司网络常要求经代理才能出网）----
#   "auto"   默认，推荐 —— 先直连；所有端口都不通时，自动尝试系统探测到的代理
#                         （环境变量 HTTPS_PROXY / IE 代理设置 / WinHTTP 代理）
#   "direct" 只直连，完全不用代理
#   "<uri>"  先直连；不通时用这个指定代理，例如：
#              proxy = "socks5://127.0.0.1:10808"
#              proxy = "http://127.0.0.1:7890"
#
# 「先直连」是有意的：直连不经任何第三方服务器，链路最短。
# 代理只在直连被拦时兜底 —— 这正是公司网络里常见的情况。
#
# 用 tools/probe_agent.py 跑一次侦察，它会直接告诉你
# 「直连是否可用」以及「经哪个代理可用」。
proxy = "auto"

[tls]
# 是否启用 TLS。强烈建议 true。
enabled = true

# 自签证书的 SHA256 指纹（十六进制，可带冒号）。
# 留空 = 不做钉扎校验。
#
# 注意：若公司网络对 TLS 做中间人解密，钉扎会导致连接失败。
# 这种情况下请留空 —— 因为另有应用层端到端 AES-256-GCM 加密，
# 中间人解出来的仍然只是密文，安全性不受影响。
pinned_fingerprint = ""

[agent]
# 采集后端：auto（dxcam 优先，失败回落 mss）| dxcam | mss
# 实测 dxcam(DXGI) 有新变化时 4.65ms、静止时 0.11ms；mss(GDI) 恒定 33ms。
capture_backend = "auto"

# 显示器序号。留空/注释掉 = 主屏（推荐）。
# 用 `ALSPD-Agent.exe --list-monitors` 可以看到编号、分辨率和位置。
#
# 多显示器是支持的：Agent 会按分辨率自动还原该显示器在虚拟桌面里的偏移，
# 键鼠注入会落到正确的屏幕上。唯一无法区分的情况是**多块显示器分辨率完全相同**，
# 此时自检与启动日志会明确警告，并建议先切回主屏。
# output = 1

# 采集后缩放到的宽度。0 = 原生分辨率（文字最清晰，推荐）。
# 若带宽吃紧，可改成家里 Viewer 窗口的宽度（如 1280），
# 这样只发能真正显示出来的分辨率 —— 画质无损，带宽省数倍。
target_width = 0

# 变化块边长（像素）。实测 64 时，办公场景变化块占比仅 0.3%。
tile_size = 64

# 判定「变化」的像素差阈值 0~255。越小越灵敏、开销越大。
change_threshold = 8

# JPEG 质量区间，自适应码率会在此范围内调整。
jpeg_quality_min = 40
jpeg_quality_max = 80

# 帧率上限。
max_fps = 20

# 全量关键帧间隔（秒），用于修正累积误差。
keyframe_interval = 2.0

# 发送队列上限。超过则主动丢帧（宁可掉帧也不要积压延迟）。
send_queue_max = 8

# 【保命措施 1】只读模式：true = 只上传画面、不注入键鼠。
# 【首次测试与回归测试请务必保持 true】
allow_input = false

# 【保命措施 2】空闲自动断连（秒）。0 = 不自动断。
# 远程无操作超时后自动松手，避免注入卡死本机。
idle_disconnect_seconds = 60

# 【保命措施 3】本地急停热键：按下后立即停止注入、松开所有按键、
# 并**彻底停止 Agent**（连重连也停掉，需手动重启才能再用）。
# 支持 ctrl / alt / shift / win 组合，主键可用字母、数字、F1~F24、
# esc / tab / space / enter / 方向键 / home / end 等。
panic_hotkey = "ctrl+alt+shift+q"

# 【保命措施 4】本机活动检测：注入后记录鼠标应有位置，下次注入前比对实际位置。
# 若明显不符（说明本机有人在动鼠标），立即暂停注入、把控制权让给本机。
# 不需要键盘钩子就能区分「我们注入的移动」和「本机手动的移动」。
input_activity_guard = true
# 偏差超过这么多像素就认为本机有人在操作
input_guard_threshold = 12
# 本机安静这么多秒后自动恢复注入（0 = 不自动恢复）
input_guard_auto_resume = 3.0

# 【演练模式】只记录「本来会注入什么」，**不真的操作键鼠**。
# 用来安全验证整条注入链路是否正常，不必担心里面的 bug 抢走你的键鼠。
# 也可用环境变量 ALSPD_INPUT_DRY_RUN=1 临时开启。
input_dry_run = false

# ---- 剪贴板同步（纯文本，双向）----
# 远程办公复制粘贴是刚需：在公司复制一段代码，回家能直接粘。
# 双向同步，两端自动去重（不会互相覆盖成死循环）。
#
# ⚠️ 剪贴板可能含敏感内容（比如刚从密码管理器复制的口令）。
#    两端都是你自己时开启是合理的；不想要就设为 false。
clipboard_sync = true

# 轮询间隔（秒）。太小会白耗 CPU，太大会显得迟钝。
clipboard_interval = 0.6

[viewer]
# 窗口初始尺寸。0 = 按收到的画面自适应。
window_width = 1280
window_height = 720

# 显示缩放模式：fit（适应窗口）| actual（原始像素）| stretch（拉伸填满）
scale_mode = "fit"

# 剪贴板同步（纯文本，双向）。不想要就用 --no-clipboard 临时关掉。
# 注意：剪贴板同步**不依赖 --enable-input** —— 它只是双向搬运文本，
# 不属于「操作目标机」。想让对端完全看不到你的剪贴板，就关掉它。
clipboard_sync = true

[relay]
# 仅中继服务器需要填这一节。

# 监听地址与端口
host = "0.0.0.0"
port = 443

# TLS 证书与私钥路径（自签即可）
cert = "/etc/alspd/relay.crt"
key = "/etc/alspd/relay.key"

[logging]
# DEBUG | INFO | WARNING | ERROR
level = "INFO"

# 日志文件路径。留空 = 只输出到控制台。
file = ""
